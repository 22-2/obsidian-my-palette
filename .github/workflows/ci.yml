name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep in sync with devEngines.packageManager in package.json.
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The unit-test job never launches Obsidian, so skip the large Electron download.
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Type check
        run: pnpm run check-types

      - name: Unit tests
        run: pnpm exec vp test
