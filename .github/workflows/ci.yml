name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep in sync with devEngines.packageManager in package.json.
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The unit-test job never launches Obsidian, so skip the large Electron download.
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Type check
        run: pnpm run check-types

      - name: Unit tests
        run: pnpm exec vp test

  e2e:
    runs-on: ubuntu-latest
    # obsidian-e2e-toolkit documents that Electron can fail to launch on GitHub's
    # Ubuntu runners (microsoft/playwright#11932). Report the result without
    # blocking merges until the job has proven stable.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      # The toolkit requires Node.js 23 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: End-to-end tests
        run: xvfb-run -a pnpm e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore
